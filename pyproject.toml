[build-system]
requires = ["setuptools>=80"]
build-backend = "setuptools.build_meta"

[project]
name = "vedic-daylight-times"
version = "1.0.0"
description = "Calculate Rahu Kalam, Gulika Kalam, Yamagandam, and Abhijit Muhurat."
readme = "README.md"
requires-python = "==3.14.7"
license = "MIT"
dependencies = [
    "Flask==3.1.3",
    "astral==3.2",
    "tzdata==2026.4",
]

[project.optional-dependencies]
dev = ["pytest==8.4.2", "pytest-cov==6.3.0"]

[project.scripts]
vedic-times = "vedic_times.app:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
vedic_times = ["templates/*.html", "static/*.css"]

[tool.pytest.ini_options]
addopts = "-q --cov=vedic_times --cov-report=term-missing"
testpaths = ["tests"]
pythonpath = ["src"]
